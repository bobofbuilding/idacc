version: 2
updates:
  - package-ecosystem: npm
    directory: /idctl-desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-production:
        dependency-type: production
      desktop-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /idctl
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
