[package]
name = "idacc-interface-simulation"
version = "0.0.0"
description = "Developer-only interface simulation; not the unified IDACC application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-http = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
